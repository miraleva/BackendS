server.port=${PORT:8083}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tourvisio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:130477}
spring.datasource.driver-class-name=org.postgresql.Driver

# GUVENLIK: SQL sorgularini production'da kapatın
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# TourVisio API Configuration
# =============================================================================
tourvisio.api.base-url=${TOURVISIO_BASE_URL:https://test-service.tourvisio.com/v2/api/}
tourvisio.api.agency=${TOURVISIO_AGENCY:INTERNSHIP}
tourvisio.api.username=${TOURVISIO_USER:${TOURVISIO_USERNAME:INTERNSHIP}}
tourvisio.api.password=${TOURVISIO_PASSWORD:1}

tourvisio.api.mock-mode=${TOURVISIO_MOCK_MODE:false}
tourvisio.api.connect-timeout=${TOURVISIO_CONNECT_TIMEOUT:15000}
tourvisio.api.read-timeout=${TOURVISIO_READ_TIMEOUT:45000}

# =============================================================================
# AI Provider Configuration
# =============================================================================
ai.openai.api-key=${AI_API_KEY:}
ai.openai.model=gpt-4o-mini

# =============================================================================
# Gemini API Configuration
# =============================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent}

# =============================================================================
# Gemini Lite API Configuration
# =============================================================================
gemini.lite.api-key=${GEMINI_LITE_API_KEY:}
gemini.lite.api-url=${GEMINI_LITE_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent}

# =============================================================================
# OpenRouter API Configuration
# =============================================================================
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.api-url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model.primary=${OPENROUTER_MODEL_PRIMARY:openai/gpt-oss-20b:free}
openrouter.model.backup=${OPENROUTER_MODEL_BACKUP:meta-llama/llama-3.3-70b-instruct:free}

spring.messages.encoding=UTF-8

# Mail Server Ayarları (Brevo SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:sannydestek@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Admin Ayarları
sanny.admin.password=${ADMIN_PASSWORD:admin}
sanny.admin.email=${ADMIN_EMAIL:sannydestek@gmail.com}

# =============================================================================
# OAuth2 Social Login Configuration
# =============================================================================
oauth.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true