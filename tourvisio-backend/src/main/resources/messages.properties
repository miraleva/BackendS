# Default (English) fallback localization messages

out.of.scope=This assistant currently supports hotel reservations and flight bookings. If you need help with either of those, I'd be happy to assist 😊
out.of.scope.terminated=This chat has been terminated due to multiple irrelevant messages.
error.profanity.terminated=I can't continue this conversation because of the language used. If you need assistance in the future, please start a new conversation.
irrelevant.warning.1=It looks like something may have been typed by mistake 🙂 I can help you search for hotels or flights. How can I assist you today?
irrelevant.warning.2=I'm still unable to understand your request. If you're not trying to search for a hotel or flight, I'll need to end this conversation soon.
irrelevant.warning.3=Since I couldn't identify a valid request, I'll end this conversation now. If you need assistance later, feel free to start a new conversation.

clarify.intent=Would you like to search for a hotel or a flight ticket?

ask.missing.single=Could you specify the {0} to perform the search?
ask.missing.multiple=Could you specify the following missing information: {0}?

# Fields for dynamic substitution
field.locationOrHotelName=location or hotel name
field.checkInDate=check-in date
field.checkOutDate=check-out date
field.adultCount=adult count
field.childCount=child count
field.childAges=children ages
field.infantCount=infant count
field.infantAges=infant ages
field.currency=currency
field.departureLocation=departure location
field.arrivalLocation=arrival location
field.departureDate=departure date
field.passengerCount=passenger count
field.tripType=trip type
field.returnDate=return date

# General system errors and fallbacks
system.error.terminated=This chat has been terminated. Please refresh the page to start a new search.
system.error.general=A system error occurred, please try again later.
search.success.fallback=Search successfully completed. Here are the top results:

# Flight search
flight.search.missing.info=Some information is missing to search for flights. Please try again.
flight.search.no.results=No flights matching your criteria were found. You could try a different date or route.
flight.search.no.results.with.dates=No flights were available for the date you specified. Flights were found on these nearby dates: {0}. You can search again with one of these dates.
flight.search.error=The flight search service is currently unavailable, please try again later.
flight.search.success={0} flights found for {1} → {2}. Best offer: {3}

# Hotel search
hotel.search.no.results=No hotels matching your criteria were found. You could try a different date or location.
hotel.search.no.results.with.dates=No hotels were available for the dates you specified. The nearest available dates for this location are: {0}. You can search again with one of these dates.
hotel.search.error=The hotel search service is currently unavailable, please try again later.
hotel.search.success={0} hotels found for {1}. Best offer: {2}
