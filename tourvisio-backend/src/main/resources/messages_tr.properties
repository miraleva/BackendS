# Turkish localization messages

out.of.scope=Otel ve uçak bileti arama ve rezervasyon konularında memnuniyetle yardımcı olabilirim 😊 Farklı bir seyahat araması yapmak isterseniz dinliyorum!
out.of.scope.terminated=Çok sayıda alakasız mesaj gönderdiğiniz için bu sohbet sonlandırılmıştır.

clarify.intent=Harika! Size yardımcı olmaktan mutluluk duyarım 😊 Seyahatiniz için otel mi aramak istersiniz, yoksa uçak bileti mi?

ask.missing.single=Harika bir seyahat planlamak için sabırsızlanıyorum 😊\n\nArama yapabilmemiz için {0} da belirtebilir misiniz?
ask.missing.multiple=Harika bir seyahat planlamak için sabırsızlanıyorum 😊\n\nSize en uygun seçenekleri listeleyebilmem için {0} da paylaşabilir misiniz?

# Fields for dynamic substitution
field.locationOrHotelName=konum veya otel adını
field.checkInDate=giriş tarihinizi
field.checkOutDate=çıkış tarihinizi
field.adultCount=misafir sayısını
field.childCount=çocuk sayısını
field.childAges=çocuklarınızın yaşlarını
field.infantCount=bebek sayısını
field.infantAges=bebeğinizin yaşını (ay/yaş)
field.currency=para birimi
field.departureLocation=kalkış noktası
field.arrivalLocation=varış noktası
field.departureDate=gidiş tarihi
field.passengerCount=yolcu sayısı
field.tripType=tek yön / gidiş-dönüş
field.returnDate=dönüş tarihi

# General system errors and fallbacks
system.error.terminated=Bu sohbet sonlandırılmıştır. Yeni bir arama başlatmak için lütfen sayfayı yenileyin.
system.error.general=Sistem hatası oluştu, lütfen daha sonra tekrar deneyiniz.
search.success.fallback=Arama başarıyla tamamlandı. İşte sizin için seçtiğim en iyi alternatifler:

invalid.date.past=Girdiğiniz tarih geçmişte kalıyor. Lütfen ileri bir tarih giriniz 😊
invalid.date.mismatch=Çıkış/dönüş tarihi, giriş/gidiş tarihinden sonra olmalıdır 😊
invalid.date.too.far=Girdiğiniz tarih çok uzak bir geleceğe ait. Lütfen önümüzdeki 2 yıl içinden bir tarih seçiniz 😊
error.no.adults=Otel rezervasyonları yasal olarak en az bir yetişkin gerektirir.
error.negative.count=Yolcu/misafir sayısı negatif olamaz. Lütfen geçerli bir sayı giriniz.
error.too.many.guests=Bir otel aramasında en fazla {0} misafir (yetişkin+çocuk+bebek) olabilir. Lütfen sayıyı azaltınız.
error.too.many.passengers=Bir uçuş aramasında en fazla {0} yolcu olabilir. Lütfen sayıyı azaltınız.
error.too.many.rooms=Oda sayısı, toplam misafir sayısından fazla veya çok yüksek olamaz. Lütfen oda sayısını azaltınız.
#search.no.results=Kriterlerinize uygun sonuç bulunamadı.

welcome.intent=Harika bir tatil ya da seyahat planlamaya hazır mısınız? 😊 Size en uygun otel veya uçak bileti seçeneklerini bulabilmem için gideceğiniz şehri, tarihlerinizi ve kaç kişi olacağınızı paylaşmanız yeterli.

# Uçak bileti arama
flight.search.missing.info=Uçuş araması için gerekli bilgiler eksik. Lütfen tekrar deneyin.
flight.search.no.results=Belirttiğiniz kriterlere uygun uçuş bulunamadı. Farklı bir tarih veya rota deneyebiliriz 😊
flight.search.no.results.with.dates=Belirttiğiniz tarihte uygun uçuş bulunamadı. Yakın tarihlerde uçuş bulunan günler: {0}. Bu tarihlerden biriyle tekrar arayabiliriz 😊
flight.search.error=Uçuş arama servisi şu anda kullanılamıyor, lütfen daha sonra tekrar deneyiniz.
flight.search.success={1} → {2} rotasında harika uçuşlar buldum! ✈️ {0} uçuş arasından öne çıkan seçeneğimiz: {3}\n\nİsterseniz bunları en erken saatli veya en uygun fiyatlı uçuşlar olarak da sıralayabilirim ✈️

# Otel arama
hotel.search.no.results=Belirttiğiniz kriterlere uygun otel bulunamadı. Farklı bir tarih veya lokasyon deneyebiliriz 😊
hotel.search.no.results.with.dates=Belirttiğiniz tarihlerde uygun otel bulunamadı. Bu lokasyon için en yakın uygun tarihler: {0}. Bu tarihlerden biriyle tekrar arayabiliriz 😊
hotel.search.error=Otel arama servisi şu anda kullanılamıyor, lütfen daha sonra tekrar deneyiniz.
hotel.search.success={1} bölgesinde harika seçenekler buldum! 🏨 {0} otel arasından öne çıkan teklifimiz: {2}\n\nİsterseniz bu seçenekleri denize sıfır oteller veya bütçe dostu alternatifler olarak da filtreleyebilirim 😊
confirm.selection={0} harika bir tercih! 🌟 Rezervasyon işlemine geçmemizi ister misiniz?
